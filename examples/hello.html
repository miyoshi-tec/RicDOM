<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RicDOM 2 — hello (no build step)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  button { font-size: 1.2rem; padding: 0.4rem 1rem; }
  output { font-size: 1.5rem; margin: 0 1rem; }
</style>
</head>
<body>
<!--
  利用側はビルド不要 (設計書 G1)。<script src> 1 本で動くことの証明。
  npm install も webpack/vite の設定も不要 — このファイルをブラウザで開くだけで動く。
-->
<div id="app"></div>

<script src="../dist/ricdom.iife.min.js"></script>
<script>
  // IIFE ビルドはグローバル `ricdom` として公開される (tsup.config.ts の globalName)。
  // createApp(target, state, render) の 3 引数 (Phase 1 実装での確定事項、設計書 §12)。
  ricdom.createApp(
    '#app',
    { count: 0 },
    (s) => ({
      tag: 'div',
      children: [
        { tag: 'button', onclick: () => { s.count -= 1; }, children: ['-'] },
        { tag: 'output', children: [String(s.count)] },
        { tag: 'button', onclick: () => { s.count += 1; }, children: ['+'] },
      ],
    }),
  );
</script>
</body>
</html>
