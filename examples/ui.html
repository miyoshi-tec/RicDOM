<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>RicDOM 2 — ui (dialog / popup / toast / tooltip、no build step)</title>
<link rel="stylesheet" href="../dist/ricdom-ui.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 640px; }
  h1 { font-size: 1.1rem; }
  .row { display: flex; gap: 0.5rem; align-items: center; margin: 0.75rem 0; }
</style>
</head>
<body>
<!--
  利用側はビルド不要 (設計書 G1)。IIFE 2 本 (ricdom → ricdom/ui) + CSS <link> だけで
  dialog/popup/toast/tooltip が動くことの証明 (設計書 G)。
  npm install も webpack/vite の設定も不要 — このファイルをブラウザで開くだけで動く。
-->
<h1>RicDOM 2 — ricdom/ui smoke</h1>
<div id="app"></div>

<script src="../dist/ricdom.iife.min.js"></script>
<script src="../dist/ricdom-ui.iife.min.js"></script>
<script>
  // IIFE ビルドはグローバル `ricdom` / `ricdomUI` として公開される
  // (tsup.config.ts の globalName)。

  // ダイアログ・ポップアップ・トースト・ツールチップは状態を持つ部品なので
  // app.use() で明示登録する (設計書 §3.4)。render 関数の外、createApp 呼び出しの
  // 直後に use() し、render 内でインスタンスを呼ぶ (dlg({...}) 等)。
  let dlg, menu, toast, tip;

  const app = ricdom.createApp(
    '#app',
    { count: 0 },
    (s) => ({
      tag: 'div',
      children: [
        { tag: 'p', children: ['count: ' + s.count] },
        {
          tag: 'div',
          class: 'row',
          children: [
            dlg
              ? dlg({
                  triggerChildren: ['ダイアログを開く'],
                  title: '確認',
                  children: ['本当に実行しますか？'],
                  actions: [
                    ricdomUI.uiButton({
                      variant: 'primary',
                      children: ['OK'],
                      onclick: () => {
                        s.count += 1;
                        dlg.close();
                        toast.show('実行しました', { type: 'success' });
                      },
                    }),
                  ],
                })
              : null,
            menu
              ? menu({
                  trigger: ['メニュー ▾'],
                  children: [
                    ricdomUI.uiButton({ children: ['複製'], onclick: () => toast.show('複製しました') }),
                    ricdomUI.uiButton({ children: ['削除'], onclick: () => toast.show('削除しました', { type: 'error' }) }),
                  ],
                })
              : null,
            tip
              ? tip({
                  content: 'ヒント: このボタンはカウントを増やします',
                  children: [
                    ricdomUI.uiButton({
                      children: ['+1'],
                      onclick: () => {
                        s.count += 1;
                      },
                    }),
                  ],
                })
              : null,
          ],
        },
        ricdomUI.uiInput({
          placeholder: '入力してみる (rest スプレッド契約の確認)',
          oninput: (e) => {
            s.count = s.count; // no-op、入力自体が編集中ガードを壊さないことの目視確認用
          },
        }),
      ],
    }),
  );

  dlg = app.use(ricdomUI.createDialog());
  menu = app.use(ricdomUI.createPopup());
  toast = app.use(ricdomUI.createToast());
  tip = app.use(ricdomUI.createTooltip());

  // テーマ切替: applyTheme は任意の要素に CSS 変数を当てるだけ (:root は使わない)。
  ricdomUI.applyTheme(document.getElementById('app'), { theme: 'light' });
</script>
</body>
</html>
